  <text x="473" y="507" class="body">全局 A/B/C 合并 · 局部选区重放</text>
  <text x="473" y="534" class="body">确认顺序 · 内容守恒 · 应用授权</text>
  <text x="473" y="571" class="path">resume-three-way-merge · change-policy</text>
  <rect x="820" y="444" width="340" height="150" rx="13" fill="#fff" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
