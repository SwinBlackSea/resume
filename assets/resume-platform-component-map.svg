  <text x="843" y="507" class="body">完整文档 · semantic kind · children 父子树</text>
  <text x="843" y="534" class="body">精简投影 · 字段继承 · 禁止 editable 嵌套</text>
  <text x="843" y="571" class="path">resume-dom.js</text>
