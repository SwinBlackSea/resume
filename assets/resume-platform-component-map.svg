  <text x="1233" y="766" class="card-title">Policies / Domain Libraries</text><text x="1233" y="795" class="body">Write Policy · Auth · Idempotency</text><text x="1233" y="822" class="body">Merge Conflicts · Audit</text><text x="1233" y="849" class="body">Job Analyzer · Resume Schema</text><text x="1233" y="882" class="path">server/lib/*.js</text>

