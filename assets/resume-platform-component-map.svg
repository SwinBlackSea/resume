  <text x="103" y="507" class="body">共享：全文 + ID + kind + children 精简投影</text>
  <text x="103" y="534" class="body">全局稀疏变化 / 局部锁定文字</text>
  <text x="103" y="571" class="path">server/lib/resume-harness/*</text>
