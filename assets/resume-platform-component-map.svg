  <text x="103" y="1405" class="body">DeepSeek Client → DeepSeek LLM</text>
  <text x="123" y="1437" class="body">HTTP/Timeout/Abort · SSE Decoder</text>
  <text x="123" y="1464" class="body">JSON Extractor · Error Mapping</text>
